<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnePoint Hospice Ordering Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --brand:#c8003a; --brand-dk:#8f0a2b; --brand-tint:#fbe3e8;
    --ink:#20232a; --muted:#5f6771; --line:#e4e6ea; --bg:#ffffff; --panel:#f4f6f8;
    --accent:#0e7c86; --accent-tint:#e2f0f1; --dark:#363538; --green:#1f9d57;
    --c2:#8c2231; --c2-tint:#f3eaec; --amber:#8a4a0a; --amber-tint:#f6ecdd; --radius:12px;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
  a{color:var(--brand)}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .spacer{flex:1}
  button{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px}
  button:hover{filter:brightness(.98)}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-dark{background:var(--dark);border-color:var(--dark);color:#fff}
  .btn-ghost{background:transparent}
  .btn-sm{font-size:12.5px;padding:6px 11px}
  input,select{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 80px}

  /* topbar */
  .topbar{background:var(--dark);color:#fff;position:sticky;top:0;z-index:30}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
  .logo{background:#fff;color:var(--dark);font-weight:800;letter-spacing:-.02em;padding:6px 12px;border-radius:9px;font-size:15px}
  .logo b{color:var(--brand)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--brand-tint);color:var(--brand-dk)}
  .whoami{font-size:13px;color:#e5e7eb}

  /* login */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 70% -10%,#f3d9e0,transparent),var(--bg);padding:20px}
  .login-card{width:100%;max-width:400px;padding:28px 26px}
  .login-card h1{font-size:20px;margin:4px 0 2px}
  .fld{display:block;margin:12px 0}
  .fld span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%}
  .err{color:var(--brand-dk);background:var(--brand-tint);border:1px solid #f2b8c4;border-radius:8px;padding:9px 11px;font-size:13px;margin-top:10px}

  /* tabs */
  .tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 18px}
  .tab{padding:10px 14px;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-size:14px}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}

  .section-head{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
  .section-head h2{font-size:20px;margin:0}

  /* order layout */
  .order-layout{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
  .med-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .med-row:last-child{border-bottom:none}
  .med-name{flex:1;min-width:150px}
  .med-name b{font-size:14.5px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .qty button{border:none;border-radius:0;background:#fff;padding:8px 11px;font-size:15px}
  .qty input{width:56px;text-align:center;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;padding:8px 4px}
  .cart{position:sticky;top:74px;overflow:hidden}
  .cart-hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .cart-body{max-height:calc(100vh - 260px);overflow:auto;padding:6px 14px}
  .cart-line{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .cart-foot{padding:14px 16px;border-top:1px solid var(--line)}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .b-c2{background:var(--c2-tint);border:1px solid #7a2233;color:var(--c2)}
  .b-c35{background:var(--amber-tint);border:1px solid #8a5316;color:var(--amber)}
  .b-nc{background:var(--accent-tint);border:1px solid #1c6470;color:#0e6d78}

  table.lines{width:100%;border-collapse:collapse}
  table.lines th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
  table.lines td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}

  .inbox-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .inbox-row:hover{background:var(--panel)}
  .status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .st-submitted{background:#fdecdd;color:#b4520a}
  .st-review{background:#e2f0f1;color:#0e7c86}
  .st-approved{background:#e6f6ec;color:#1f9d57}
  .st-cancelled{background:#eceef1;color:#6b7480}
  .st-dea,.st-ordered,.st-shipped,.st-complete{background:#e2f0f1;color:#0e7c86}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-bottom:none;cursor:default}
  .frow:first-child{border-radius:9px 9px 0 0}
  .frow:last-child{border-bottom:1px solid var(--line);border-radius:0 0 9px 9px}
  .frow.done{background:#f2f8f4}
  .frow.nextstep{background:#fff6e6;animation:rowflash 1.2s ease-in-out infinite}
  @keyframes rowflash{50%{background:#ffe9c2}}
  .frow .num{width:20px;text-align:right;color:var(--muted);font-size:12px}
  .frow .lbl{flex:1;font-size:13.5px}
  .frow .stamp{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .flashstep{color:var(--amber);font-weight:800;font-size:11px}
  .fedex{color:var(--brand);font-weight:700;text-decoration:none}
  @media(max-width:820px){ .order-layout{grid-template-columns:1fr} .cart{position:static} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login" class="login-shell">
  <div class="card login-card">
    <div class="logo" style="display:inline-block">One<b>Point</b> Ordering</div>
    <h1>Sign in</h1>
    <div class="muted" style="font-size:13px">Hospice ordering &amp; pharmacy fulfillment portal.</div>
    <label class="fld"><span>Email</span><input id="li-email" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label class="fld"><span>Password</span><input id="li-pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn-primary" id="li-go" style="width:100%;margin-top:6px">Sign in</button>
    <div id="li-err" class="err hidden"></div>
  </div>
</div>

<!-- APP -->
<div id="view-app" class="hidden">
  <div class="topbar"><div class="topbar-inner">
    <div class="logo">One<b>Point</b> Ordering</div>
    <span id="roleTag" class="pill"></span>
    <span class="spacer"></span>
    <span id="whoName" class="whoami"></span>
    <button class="btn-ghost btn-sm" id="signout" style="color:#e5e7eb;border-color:#3b4655">Sign out</button>
  </div></div>
  <div class="wrap" id="appBody"></div>
</div>

<div id="toast" class="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Config — safe to be public; Row-Level Security protects the data.
// ---------------------------------------------------------------------------
const SUPABASE_URL  = "https://tgyqaqgzaxylpggflzvw.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRneXFhcWd6YXh5bHBnZ2ZsenZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTY0NjQsImV4cCI6MjEwMzQ5MjQ2NH0.pK9pCVNUPIGxb5FFkGDd8lEodShDI_8TFsV__CM149o";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = s => document.querySelector(s);
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- session / identity ----------------------------------------------------
let ME = null;   // { userId, email, fullName, isStaff, role, orgIds:[] }
let CART = {};   // medId -> qty
let MEDS = [];   // formulary cache
let CURRENT_CC = null;   // care center object (hospice ordering)
let RT = null;   // realtime channel

async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if(session){ await afterLogin(session); } else { showLogin(); }
  db.auth.onAuthStateChange((_e, s)=>{ if(!s){ showLogin(); } });
}

function showLogin(){
  $('#view-app').classList.add('hidden');
  $('#view-login').classList.remove('hidden');
}

async function doLogin(){
  const email=$('#li-email').value.trim(), pw=$('#li-pw').value;
  $('#li-err').classList.add('hidden');
  if(!email||!pw){ return showErr('Enter your email and password.'); }
  $('#li-go').textContent='Signing in…'; $('#li-go').disabled=true;
  const { data, error } = await db.auth.signInWithPassword({ email, password:pw });
  $('#li-go').textContent='Sign in'; $('#li-go').disabled=false;
  if(error){ return showErr(error.message); }
  await afterLogin(data.session);
}
function showErr(m){ const e=$('#li-err'); e.textContent=m; e.classList.remove('hidden'); }

async function afterLogin(session){
  const uid = session.user.id;
  // memberships determine role + tenant
  const { data:mem, error } = await db.from('memberships').select('role,org_id');
  if(error){ return showErr('Could not load your account: '+error.message); }
  const roles = (mem||[]).map(m=>m.role);
  const isStaff = roles.includes('pharmacy') || roles.includes('admin');
  const orgIds = (mem||[]).filter(m=>m.org_id).map(m=>m.org_id);
  let fullName = session.user.email;
  const { data:prof } = await db.from('profiles').select('full_name,title').eq('id',uid).maybeSingle();
  if(prof && prof.full_name) fullName = prof.full_name;
  ME = { userId:uid, email:session.user.email, fullName,
         isStaff, role: roles.includes('admin')?'admin':(roles.includes('pharmacy')?'pharmacy':'hospice'),
         orgIds };

  if(!isStaff && orgIds.length===0){
    // logged in but not assigned to anything yet
    $('#view-login').classList.add('hidden'); $('#view-app').classList.remove('hidden');
    $('#roleTag').textContent='No access'; $('#whoName').textContent=ME.email;
    $('#appBody').innerHTML='<div class="card" style="padding:24px"><h2>Account not set up yet</h2><p class="muted">Your login works, but an administrator hasn\'t assigned you to an organization yet. Ask your OnePoint admin to add your membership.</p></div>';
    wireChrome(); return;
  }

  $('#view-login').classList.add('hidden'); $('#view-app').classList.remove('hidden');
  const rt = ME.role==='admin'?'Admin':(ME.role==='pharmacy'?'Pharmacy Staff':'Hospice');
  $('#roleTag').textContent = rt;
  $('#whoName').textContent = ME.fullName;
  wireChrome();

  if(ME.isStaff){ renderPharmacy(); }
  else { CURRENT_CC=null; renderHospiceHome(); }
  subscribeRealtime();
}

function wireChrome(){
  $('#signout').onclick = async ()=>{ if(RT){ db.removeChannel(RT); RT=null; } await db.auth.signOut(); location.reload(); };
}

// ---- helpers ---------------------------------------------------------------
function pkgInc(pack){ const m=(pack||'').match(/of\s+(\d+)(?:\s|$)/); return m?parseInt(m[1]):1; }
function schClass(s){ return s==='CII'?'c2':(['CTRL','CIII','CIV','CV'].includes(s)?'c35':'nc'); }
function schBadge(s){
  if(s==='CII') return '<span class="badge b-c2">◆ Schedule II</span>';
  if(['CTRL','CIII','CIV','CV'].includes(s)) return '<span class="badge b-c35">Schedule III–V</span>';
  return '<span class="badge b-nc">Non-controlled</span>';
}
const STATUS_LABEL = { submitted:'Submitted', review:'Order Received', approved:'Approved', dea:'DEA 222', ordered:'Ordered', shipped:'Shipped', complete:'Complete', cancelled:'Cancelled' };

async function loadMeds(){
  if(MEDS.length) return MEDS;
  const { data, error } = await db.from('medications').select('id,name,strength,form,schedule,pack').eq('active',true).order('name');
  if(error){ toast('Could not load formulary: '+error.message); return []; }
  MEDS = data||[]; return MEDS;
}

// ---- Phase 2: pharmacy identity, unit-of-measure, documents ----------------
const PHARMACY = { name:'OnePoint Patient Care', addr:'2651 Compass Rd Suite 100, Glenview, IL 60026', phone:'877-791-6772', fax:'877-791-6774', dea:'FO9845251', permit:'PH33018' };
const PIPELINE_C2 = ['submitted','review','approved','dea','ordered','shipped','complete'];
const PIPELINE_NC = ['submitted','review','approved','ordered','shipped','complete'];
function pipelineFor(o){ return o.has_c2?PIPELINE_C2:PIPELINE_NC; }
function nowStr(){ return new Date().toLocaleString(); }
function schLabelPlain(s){ return s==='CII'?'C-II':(['CTRL','CIII','CIV','CV'].includes(s)?'C-III–V':(s==='OTC'?'OTC':'Rx')); }
function uomLabel(m){
  let s=(m.pack||'').split('=')[0].replace(/multi[-\s]?dose\s+vials?/ig,'MDV').replace(/[-–]/g,' ');
  const t=s.trim().split(/\s+/); const stop=w=>['box','of','pack','case','carton','bx'].includes(w.toLowerCase());
  let end=-1; for(let i=t.length-1;i>=0;i--){ if(/^[a-zA-Z]+$/.test(t[i])&&!stop(t[i])){end=i;break;} }
  if(end<0) return ''; let st=end; for(let i=end-1;i>=0;i--){ if(/^[a-zA-Z]+$/.test(t[i])&&!stop(t[i])){st=i;}else break; }
  const raw=t.slice(st,end+1).join(' '); if(/^(mdv|pfs)$/i.test(raw)) return raw.toUpperCase();
  return raw.replace(/\b\w/g,c=>c.toUpperCase());
}
function uomQty(m,q){ let u=uomLabel(m); if(!u) return String(q); const ab=/^[A-Z]{2,}$/.test(u); if(q!=1&&!ab&&!/s$/i.test(u)) u+='s'; return q+' '+u; }
function packDisp(m){ return (m.pack||'').replace(/multi[-\s]?dose\s+vials?/ig,'MDV'); }
function pkgsOf(l,m){ const inc=pkgInc(m.pack); return inc>1?Math.round((l.approved_qty||0)/inc):(l.approved_qty||0); }
function rxName(rx){ return rx?((rx.first_name||'')+' '+(rx.last_name||'')).trim():''; }
function openDoc(html){ const w=window.open('','_blank','width=920,height=1000'); if(!w){ toast('Please allow pop-ups to print.'); return; } w.document.write(html); w.document.close(); w.focus(); }

async function fetchFull(orderId){
  const { data:o, error } = await db.from('orders').select('*, care_centers(*), order_lines(*, medications(*))').eq('id',orderId).single();
  if(error){ toast(error.message); return null; }
  const { data:rx } = await db.from('prescribers').select('*').eq('care_center_id', o.care_center_id).order('is_primary',{ascending:false}).limit(1).maybeSingle();
  o._rx = rx||null; return o;
}
async function printRequest(orderId){ const o=await fetchFull(orderId); if(o) openDoc(wholesaleRequestDoc(o,o._rx)); }
async function printInvoiceLive(orderId){ const o=await fetchFull(orderId); if(o) openDoc(invoiceDoc(o,o._rx)); }

function docCss(){ return `body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#16232e;margin:0;font-size:13px}
   .hd{display:flex;justify-content:space-between;border-bottom:3px solid #c8003a;padding-bottom:12px}
   .hd h1{margin:0;font-size:18px;color:#c8003a}.sm{font-size:11.5px;color:#5c6b78;line-height:1.5}
   .rq{text-align:right}.rq h2{margin:0;font-size:15px;letter-spacing:.02em}
   table{width:100%;border-collapse:collapse;margin-top:8px}
   th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:#5c6b78;border-bottom:2px solid #dce3ea;padding:7px 8px}
   td{padding:8px;border-bottom:1px solid #eef1f4;vertical-align:top}.r{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.s{color:#5c6b78;font-size:11px}
   .ack{margin:14px 0;font-size:12px;line-height:1.5;background:#f4f7fb;border:1px solid #dce3ea;border-radius:8px;padding:12px 14px}
   .att{border-color:#f0d9a8;background:#fff6e6;color:#8a5a12}
   .c2{margin-top:14px;border:1px solid #7a2233;background:#f3eaec;border-radius:8px;padding:12px 14px;font-size:12px;color:#8c2231}
   .band{margin:14px 0;font-weight:800;padding:8px 12px;border-radius:8px;background:#eef1f4}
   .band.c2{background:#f3eaec;color:#8c2231;border:1px solid #7a2233}.band.c35{background:#f6ecdd;color:#8a4a0a}.band.nc{background:#e2f0f1;color:#0e6d78}
   .cols{display:flex;gap:16px;margin:8px 0}.box{flex:1;border:1px solid #dce3ea;border-radius:8px;padding:10px 12px;font-size:12px}.box h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;color:#5c6b78}
   .sign{margin-top:30px;display:flex;gap:40px}.sign .l{flex:1;border-top:1px solid #16232e;padding-top:5px;font-size:11px;color:#5c6b78}
   .fax{margin-top:20px;border-top:1px solid #dce3ea;padding-top:12px;font-size:12px;color:#37506e;font-weight:600}
   .noprint{padding:14px 40px 0}@media print{.noprint{display:none}}
   button{font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:8px;border:1px solid #c8003a;background:#c8003a;color:#fff;cursor:pointer}`; }

function wholesaleRequestDoc(o, rx){
  const cc=o.care_centers||{};
  const rows=o.order_lines.map(l=>{ const m=l.medications||{}; return `<tr><td>${esc(m.name)}<div class="s">${esc(m.strength||'')} · ${esc(m.form||'')}</div></td><td>${schLabelPlain(m.schedule)}${m.schedule==='CII'?' ◆':''}</td><td class="r"><b>${esc(uomQty(m,l.requested_qty))}</b></td></tr>`; }).join('');
  const c2=o.order_lines.filter(l=>(l.medications||{}).schedule==='CII');
  return `<!doctype html><html><head><meta charset="utf-8"><title>Order Request ${esc(o.order_no)}</title><style>${docCss()} .page{padding:32px 40px}</style></head><body>
   <div class="noprint"><button onclick="window.print()">🖨 Print</button></div>
   <div class="page">
     <div class="hd"><div><h1>${esc(cc.name||'')}</h1><div class="sm">${esc(cc.ship_to||'')}<br>Phone ${esc(cc.phone||'—')} · Facility DEA ${esc(cc.facility_dea||'—')} · Permit ${esc(cc.permit||'—')}<br>Prescriber: ${esc(rxName(rx)||'—')} · NPI ${esc(rx&&rx.npi||'—')} · DEA ${esc(rx&&rx.dea||'—')}</div></div>
       <div class="rq"><h2>WHOLESALE ORDER REQUEST</h2><div class="sm">Request: <b>${esc(o.order_no)}</b><br>Date: ${nowStr()}<br>Supplier: ${PHARMACY.name}</div></div></div>
     <div class="ack">I am an authorized purchaser for the above named hospice and request delivery of the following medications from ${PHARMACY.name}. I acknowledge that ordering and accepting possession of these medications may require additional administrative and/or clinical review and documentation that I assume responsibility for.</div>
     <div class="ack att"><b>ATTENTION:</b> By submitting this order, you acknowledge that quantities below the manufacturer's standard package size may be adjusted to the full package size if partial dispensing is unavailable.</div>
     <table><thead><tr><th>Medication</th><th>Schedule</th><th class="r">Qty requested</th></tr></thead><tbody>${rows}</tbody></table>
     ${c2.length?`<div class="c2"><b>◆ Schedule II items included (${c2.length}).</b> These require a completed DEA Form 222 in addition to this request: ${c2.map(l=>esc((l.medications||{}).name)).join(', ')}. <b>You must fax a copy of the DEA 222 with this order request.</b> Schedule II items ship only after the pharmacy receives your 222.</div>`:''}
     ${o.purchaser_name?`<div style="margin-top:16px;font-size:11.5px;color:#5c6b78">Electronically acknowledged by <b>${esc(o.purchaser_name)}</b>${o.purchaser_email?' ('+esc(o.purchaser_email)+')':''}</div>`:''}
     <div class="sign"><div class="l">Authorized signature</div><div class="l">Date</div></div>

function invoiceDoc(o, rx){
  const cc=o.care_centers||{};
  const classes=[['nc','Non-Controlled','NC'],['c35','Schedule III–V','C35'],['c2','Schedule II (C-II)','C2']];
  const pages=classes.map(([key,label,tag])=>{
    const lines=o.order_lines.filter(l=>schClass((l.medications||{}).schedule)===key);
    if(!lines.length) return '';
    const rows=lines.map(l=>{ const m=l.medications||{}; return `<tr><td>${esc(m.name)}<div class="s">${esc(m.strength||'')} · ${esc(m.form||'')}</div></td><td class="mono">${esc(l.ndc||'—')}</td><td class="r">${esc(packDisp(m))}</td><td class="r"><b>${pkgsOf(l,m)}</b></td></tr>`; }).join('');
    return `<div class="page">
      <div class="hd"><div><h1>${PHARMACY.name}</h1><div class="sm">${PHARMACY.addr}<br>Phone ${PHARMACY.phone} · Fax ${PHARMACY.fax}<br>DEA ${PHARMACY.dea}</div></div>
        <div class="rq"><h2>WHOLESALE INVOICE</h2><div class="sm">Invoice: <b>${esc(o.order_no)}-${tag}</b><br>Drug class: <b>${label}</b><br>Order: <b>${esc(o.order_no)}</b><br>Date: ${nowStr()}</div></div></div>
      <div class="band ${key}">${key==='c2'?'◆ ':''}${label}</div>
      <div class="cols"><div class="box"><h3>Bill To / Ship To</h3>${esc(cc.name||'')}<br>${esc(cc.ship_to||'')}<br>Phone ${esc(cc.phone||'')}<br>Facility DEA ${esc(cc.facility_dea||'')}</div>
        <div class="box"><h3>Authorized Prescriber</h3>${esc(rxName(rx)||'—')}<br>NPI ${esc(rx&&rx.npi||'—')} · DEA ${esc(rx&&rx.dea||'—')}<br>Unit Manager: ${esc(cc.unit_mgr||'—')}</div></div>
      <table><thead><tr><th>Medication</th><th>NDC</th><th class="r">Pack</th><th class="r">Qty</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sign"><div class="l">Authorized signature</div><div class="l">Date</div></div>
    </div>`;
  }).filter(Boolean).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><title>Invoice ${esc(o.order_no)}</title><style>${docCss()} .page{padding:30px 38px;page-break-after:always}</style></head><body>
   <div class="noprint"><button onclick="window.print()">🖨 Print</button></div>${pages||'<div class="page">No line items.</div>'}</body></html>`;
}

// ---- fulfillment tracker (pharmacy-only) -----------------------------------
const FULFILL_STEPS=[{k:'placed',l:'Orders Placed'},{k:'received',l:'Orders Received'},{k:'typed',l:'Typed'},{k:'initialed',l:'Initialed'},{k:'printed',l:'Printed'},{k:'filled',l:'Filled'},{k:'finaled',l:'Finaled'},{k:'tracking',l:"FedEx Tracking #'s Received from Delivery"}];
async function fetchFulfill(orderId){ const { data }=await db.from('fulfillment_steps').select('*').eq('order_id',orderId); const map={}; (data||[]).forEach(r=>map[r.step_key]=r); return map; }
function fulfillmentPanel(o){
  const f=o._fulfill||{};
  const done=FULFILL_STEPS.filter(s=>f[s.k]&&f[s.k].done).length;
  const firstPending=FULFILL_STEPS.findIndex(s=>!(f[s.k]&&f[s.k].done));
  const rows=FULFILL_STEPS.map((s,i)=>{ const st=f[s.k]; const on=!!(st&&st.done); const isNext=(i===firstPending);
    const stamp = on ? ('✓ '+((st.by_initials?st.by_initials+' · ':'')+(st.done_at?new Date(st.done_at).toLocaleDateString():''))) : '';
    return `<label class="frow${on?' done':''}${isNext?' nextstep':''}"><input type="checkbox" data-ff="${s.k}" ${on?'checked':''}><span class="num">${i+1}.</span><span class="lbl">${esc(s.l)}${isNext?' <span class="flashstep">◀ next</span>':''}</span><span class="stamp">${stamp}</span></label>`;
  }).join('');
  return `<div class="card" style="margin-top:16px;padding:14px 16px">
    <div style="display:flex;align-items:center;gap:10px"><b>🧾 Internal Fulfillment Tracker</b><span class="spacer"></span><span class="pill">${done}/${FULFILL_STEPS.length} complete</span></div>
    <div class="muted" style="font-size:12px;margin:2px 0 10px">Pharmacy-only — not visible to the hospice. Checking a step records who completed it.</div>
    <div>${rows}</div></div>`;
}
function wireFulfillment(o){
  document.querySelectorAll('[data-ff]').forEach(cb=>cb.onchange=async()=>{
    const k=cb.dataset.ff, step=FULFILL_STEPS.find(s=>s.k===k);
    if(cb.checked){
      const ini=(prompt('Enter your initials to mark "'+step.l+'" complete:')||'').trim().toUpperCase();
      if(!ini){ cb.checked=false; return; }
      const { error }=await db.from('fulfillment_steps').upsert({ order_id:o.id, step_key:k, done:true, by_initials:ini, done_at:new Date().toISOString() },{ onConflict:'order_id,step_key' });
      if(error){ cb.checked=false; return toast(error.message); }
    } else {
      await db.from('fulfillment_steps').upsert({ order_id:o.id, step_key:k, done:false, by_initials:null, done_at:null },{ onConflict:'order_id,step_key' });
    }
    openOrder(o.id);
  });
}

function drawMeds(){
  const q=($('#search')?.value||'').toLowerCase().trim();

    if(f==='CII'&&m.schedule!=='CII') return false;

    if(f==='nc'&&!['RX','OTC'].includes(m.schedule)) return false;

    return true;
  });
  const host=$('#medList');
  if(!items.length){ host.innerHTML='<div class="empty">No medications match.</div>'; return; }
  host.innerHTML = items.map(m=>{
    const inc=pkgInc(m.pack); const qn=CART[m.id]||0;
    return `<div class="med-row">
      <div class="med-name"><b>${esc(m.name)}</b>
        <div class="sub">${esc(m.strength||'')} · ${esc(m.form||'')} · ${esc(m.pack||'')} ${schBadge(m.schedule)}${inc>1?` · <span class="muted">multiples of ${inc}</span>`:''}</div>

        <button data-act="dec">−</button>
        <input type="number" min="0" step="${inc}" value="${qn}" data-inp>
        <button data-act="inc">+</button>
      </div>
    </div>`;
  }).join('');
  host.querySelectorAll('.qty').forEach(q=>{
    const id=q.dataset.med, inc=pkgInc((MEDS.find(m=>m.id===id)||{}).pack);
    const inp=q.querySelector('[data-inp]');
    const set=v=>{ v=Math.max(0,v); if(v>0)CART[id]=v; else delete CART[id]; inp.value=v; drawCart(); };
    q.querySelector('[data-act=inc]').onclick=()=>set((parseInt(inp.value)||0)+inc);
    q.querySelector('[data-act=dec]').onclick=()=>set(Math.max(0,(parseInt(inp.value)||0)-inc));
    inp.onchange=()=>{ let v=parseInt(inp.value)||0; if(inc>1&&v%inc!==0){ v=Math.round(v/inc)*inc; toast('Rounded to multiples of '+inc); } set(v); };
  });
}
function drawCart(){
  const ids=Object.keys(CART).filter(id=>CART[id]>0);
  $('#cartCount').textContent = ids.length? ids.length+' item'+(ids.length>1?'s':'') : '';
  const body=$('#cartBody'), foot=$('#cartFoot');
  if(!ids.length){ body.innerHTML='<div class="empty" style="padding:24px">Your cart is empty.</div>'; foot.innerHTML=''; return; }
  body.innerHTML = ids.map(id=>{ const m=MEDS.find(x=>x.id===id); return `<div class="cart-line">
      <div style="flex:1">${esc(m.name)} <span class="muted">${esc(m.strength||'')}</span></div>
      <b>${CART[id]}</b><button class="btn-ghost btn-sm" data-rm="${id}">✕</button></div>`;}).join('');
  const hasC2 = ids.some(id=>(MEDS.find(m=>m.id===id)||{}).schedule==='CII');
  foot.innerHTML = `${hasC2?'<div class="badge b-c2" style="margin-bottom:10px">◆ Contains Schedule II — a DEA 222 step will follow approval</div>':''}
    <button class="btn-primary" id="submitOrder" style="width:100%">Submit order request</button>`;

}

async function submitOrder(){

  }).select().single();

    <div class="muted" style="font-size:13px;margin-bottom:12px">New NDC <b style="font-family:var(--mono);color:var(--ink)">${esc(newVal||'(cleared)')}</b> for ${esc((o.care_centers||{}).name||'')}. How should this apply?</div>
    <label style="display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;cursor:pointer"><input type="radio" name="ndcs" value="master" checked style="margin-top:3px"><span><b>Update master list</b> <span class="badge b-nc" style="font-size:10px">default</span><br><span class="muted" style="font-size:12px">Saves this NDC to the care center's Omnicell/master inventory for this and all future orders.</span></span></label>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn-ghost" data-x>Cancel</button><button class="btn-primary" data-ok>Confirm</button></div>
  </div>`;
  document.body.appendChild(ov);
  const cancel=()=>{ ov.remove(); openOrder(o.id); };

  ov.onclick=e=>{ if(e.target===ov) cancel(); };
  ov.querySelector('[data-ok]').onclick=async()=>{
    const scope=ov.querySelector('input[name=ndcs]:checked').value;
    const { error }=await db.from('order_lines').update({ ndc:newVal, ndc_one_time: scope==='once' }).eq('id',l.id);

function renderPharmActions(o){
  const host=$('#pharmActions'); if(!host) return;
  const approvedPlus=['approved','dea','ordered','shipped','complete'].includes(o.status);
  const a=[];
  a.push(`<button class="btn-ghost btn-sm" data-doc="req">🖨 Order Request</button>`);
  if(approvedPlus) a.push(`<button class="btn-ghost btn-sm" data-doc="inv">🖨 Invoice</button>`);
  if(approvedPlus && o.has_c2) a.push(`<button class="btn-ghost btn-sm" data-doc="dea" style="color:var(--c2);border-color:#d9b3bb">◆ DEA 222</button>`);
  if(['shipped','complete'].includes(o.status)) a.push(`<button class="btn-ghost btn-sm" data-doc="pod">🖨 Delivery confirmation</button>`);
  if(o.status==='submitted') a.push(`<button class="btn-dark" data-adv="review">📥 Order Received</button>`);
  else if(o.status==='review') a.push(`<button class="btn-accent" data-adv="approved">✓ Approve</button>`);
  else if(o.status==='approved'){
    if(o.has_c2) a.push(`<button class="btn-primary" data-req222>◆ Request DEA 222</button>`);
    else a.push(`<button class="btn-dark" data-adv="ordered">📦 Place Wholesale Order</button>`);
  }
  else if(o.status==='dea'){
    if(o.dea222_received) a.push(`<button class="btn-dark" data-adv="ordered">📦 Place Wholesale Order (222 received)</button>`);
    else { a.push(`<span class="muted">⏳ Awaiting DEA 222 from hospice…</span>`); a.push(`<button class="btn-ghost btn-sm" data-req222>Resend 222 request</button>`); }
  }
  else if(o.status==='ordered') a.push(`<button class="btn-dark" data-ship>🚚 Mark Shipped</button>`);
  else if(o.status==='shipped') a.push(`<button class="btn-accent" data-adv="complete">✓ Mark Delivered / Complete</button>`);
  else if(o.status==='complete') a.push(`<span class="muted">✔ Order complete.</span>`);
  else if(o.status==='cancelled') a.push(`<span class="muted">This order was cancelled.</span>`);
  if(!['submitted','cancelled','complete'].includes(o.status)) a.push(`<button class="btn-ghost btn-sm" data-back>← Back a step</button>`);
  if(['submitted','review'].includes(o.status)) a.push(`<button class="btn-ghost btn-sm" data-cancel style="color:var(--brand)">Cancel order</button>`);
  host.innerHTML=a.join(' ');
  host.querySelectorAll('[data-adv]').forEach(btn=>btn.onclick=()=>advance(o, btn.dataset.adv));
  host.querySelectorAll('[data-doc]').forEach(btn=>btn.onclick=()=>{
    const d=btn.dataset.doc;
    if(d==='req') printRequest(o.id);
    else if(d==='inv') printInvoiceLive(o.id);
    else if(d==='dea') openDea222Live(o.id,'supplier');
    else if(d==='pod') printDelivery(o.id);
  });
  const r2=host.querySelector('[data-req222]'); if(r2) r2.onclick=()=>requestDea222(o);
  const sh=host.querySelector('[data-ship]'); if(sh) sh.onclick=()=>markShipped(o);
  const bk=host.querySelector('[data-back]'); if(bk) bk.onclick=()=>stepBack(o);
  const cx=host.querySelector('[data-cancel]'); if(cx) cx.onclick=async()=>{
    if(!confirm('Cancel this order?')) return;
    const { error }=await db.rpc('cancel_order',{p_order:o.id}); if(error) return toast(error.message);
    toast('Order cancelled.'); openOrder(o.id);
  };
}

async function advance(o, to){
  if(to==='approved'){
    for(const l of o.order_lines){ await db.from('order_lines').update({ approved_qty:l.approved_qty }).eq('id',l.id); }
  }
  const patch={ status:to };
  if(to==='complete'){ patch.delivered=true; patch.delivered_at=new Date().toISOString(); }
  const { error } = await db.from('orders').update(patch).eq('id',o.id);
  if(error) return toast('Error: '+error.message);
  if(to==='complete' && o._shipment){ await db.from('shipments').update({ delivered_at:new Date().toISOString().slice(0,10) }).eq('order_id',o.id); }
  await db.from('order_events').insert({ order_id:o.id, type:to, actor_id:ME.userId, actor_name:ME.fullName });
  const msg={ review:'Marked as received.', approved:'Order approved.', ordered:'Wholesale order placed.', complete:'Order marked delivered & complete.' }[to]||'Updated.';
  toast(msg); openOrder(o.id);
}

async function stepBack(o){
  const flow=pipelineFor(o); const idx=flow.indexOf(o.status);
  if(idx<=0) return; const to=flow[idx-1];
  const patch={ status:to };
  if(to==='approved'){ patch.dea222_requested=false; patch.dea222_received=false; }  // stepping back before the 222 request
  await db.from('orders').update(patch).eq('id',o.id);
  await db.from('order_events').insert({ order_id:o.id, type:to+' (moved back)', actor_id:ME.userId, actor_name:ME.fullName });
  toast('Moved back to '+(STATUS_LABEL[to]||to)+'.'); openOrder(o.id);
}

async function requestDea222(o){
  const full = await fetchFull(o.id);
  const c2 = (full?full.order_lines:[]).filter(l=>(l.medications||{}).schedule==='CII');
  const cc=(full&&full.care_centers)||{};
  const subject=`DEA Form 222 required — order ${o.order_no} (${cc.name||''})`;
  const body=`Hello,\n\nYour wholesale order ${o.order_no} has been approved by ${PHARMACY.name}. It includes Schedule II item(s) that require a completed DEA Form 222 before they can be shipped:\n\n`
    + c2.map(l=>`  • ${(l.medications||{}).name} ${(l.medications||{}).strength||''} — approved qty ${l.approved_qty}`).join('\n')
    + `\n\nPlease complete and MAIL your original DEA Form 222 to:\n${PHARMACY.name}\n${PHARMACY.addr}\n\nThen log in to the portal and click "I have mailed the DEA 222" on this order. Schedule II items ship only after we receive your 222.\n\nThank you,\n${PHARMACY.name}\nPhone ${PHARMACY.phone} · Fax ${PHARMACY.fax}`;
  const href=`mailto:${encodeURIComponent(o.purchaser_email||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const a=document.createElement('a'); a.href=href; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
  const { error }=await db.from('orders').update({ status:'dea', dea222_requested:true }).eq('id',o.id);
  if(error) return toast('Error: '+error.message);
  await db.from('order_events').insert({ order_id:o.id, type:'dea222_requested', actor_id:ME.userId, actor_name:ME.fullName, note:'DEA 222 requested from hospice' });
  toast('DEA 222 request email opened. Order moved to DEA 222 step.'); openOrder(o.id);
}

async function markShipped(o){
  const raw = prompt('Enter FedEx tracking number(s), separated by spaces or commas (one per package). Leave blank to ship without tracking:');
  if(raw===null) return;   // cancelled
  const tracking = raw.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const today=new Date().toISOString().slice(0,10);
  const { error:se } = await db.from('shipments').upsert({ order_id:o.id, carrier:'FedEx', tracking, ship_date:today, shipped:true },{ onConflict:'order_id' });
  if(se) return toast('Error: '+se.message);
  const { error } = await db.from('orders').update({ status:'shipped' }).eq('id',o.id);
  if(error) return toast('Error: '+error.message);
  await db.from('order_events').insert({ order_id:o.id, type:'shipped', actor_id:ME.userId, actor_name:ME.fullName, note:tracking.length?('Tracking: '+tracking.join(', ')):'Shipped' });
  toast('Order marked shipped.'); openOrder(o.id);
}

// ---- realtime: refresh the current view when orders change -----------------
function subscribeRealtime(){
  if(RT){ db.removeChannel(RT); RT=null; }
  RT = db.channel('orders-live')
    .on('postgres_changes',{ event:'*', schema:'public', table:'orders' }, ()=>{
      if(ME.isStaff && !ACTIVE_ORDER){ renderPharmacy(); }
      else if(!ME.isStaff && CURRENT_CC && hospTab==='mine'){ renderMyOrders(); }
    })
    .subscribe();
}

// ---- go --------------------------------------------------------------------
$('#li-go').onclick=doLogin;
$('#li-pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
boot();
</script>
